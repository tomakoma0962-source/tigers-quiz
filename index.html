<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>あなたは阪神の誰タイプ？ | タイガース性格診断</title><style>:root{font-family:system-ui,'Noto Sans JP',sans-serif;color:#f8f8f8;background:#111}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#363009,#111 55%);min-height:100vh}.wrap{max-width:700px;margin:auto;padding:28px 18px 60px}.brand{color:#ffe100;letter-spacing:.2em;font-size:12px;font-weight:900}.hero{text-align:center;padding:50px 0 25px}h1{font-size:clamp(30px,7vw,50px);line-height:1.25;margin:15px 0}.yellow{color:#ffe100}.sub{color:#c6c6c6;line-height:1.8}.panel{background:#202020;border:1px solid #494333;border-radius:22px;padding:26px;box-shadow:0 15px 45px #0006}.btn{border:0;border-radius:13px;background:#ffe100;color:#141414;font-size:17px;font-weight:900;padding:17px 22px;cursor:pointer;width:100%;margin-top:20px}.btn:hover{background:#ffed67}.ghost{background:transparent;color:#eee;border:1px solid #777}.choices{display:grid;gap:11px;margin-top:24px}.choice{background:#303030;border:1px solid #505050;border-radius:12px;padding:16px;text-align:left;color:white;font-size:15px;cursor:pointer;line-height:1.5}.choice:hover,.choice:focus{border-color:#ffe100;background:#413b20}.meta{display:flex;justify-content:space-between;color:#ffe100;font-weight:800;font-size:13px}.bar{height:8px;background:#444;border-radius:9px;overflow:hidden;margin:14px 0 26px}.fill{height:100%;background:#ffe100;transition:width .25s}.resultname{font-size:clamp(29px,7vw,44px);font-weight:900;color:#ffe100;margin:14px 0}.tag{display:inline-block;border:1px solid #ffe100;border-radius:30px;color:#ffe100;padding:7px 13px;font-size:13px;font-weight:800}.stat{background:#303030;padding:13px;border-radius:10px;margin-top:12px}.small{font-size:12px;color:#aaa;text-align:center;margin-top:30px;line-height:1.7}.hidden{display:none}.back{border:0;background:none;color:#ccc;cursor:pointer;padding:12px 0}</style></head><body><main class="wrap"><div class="brand">TIGERS PERSONALITY QUIZ</div><section id="start" class="hero"><div style="font-size:60px">🐯⚾</div><h1>あなたは阪神の<br><span class="yellow">誰タイプ？</span></h1><p class="sub">日常の選択から、あなたに似た阪神タイガースの選手を診断！<br>12問の質問で、隠れた性格とチームでの役割がわかる。</p><div class="panel" style="text-align:left;margin-top:30px"><div>✓ 12問・約3分</div><p>✓ 12選手のタイプから判定</p><div>✓ 性格解説＆相性診断つき</div><button class="btn" onclick="start()">診断スタート →</button></div></section><section id="quiz" class="panel hidden" style="margin-top:40px"><div class="meta"><span id="counter"></span><span>直感で選んでね！</span></div><div class="bar"><div id="fill" class="fill"></div></div><h2 id="question" style="line-height:1.55"></h2><div id="choices" class="choices"></div><button id="back" class="back" onclick="prev()">← 前の質問に戻る</button></section><section id="result" class="panel hidden" style="margin-top:40px;text-align:center"><div class="tag">診断結果</div><p class="sub">あなたは阪神タイガースの…</p><div class="resultname" id="player"></div><h2 id="type"></h2><p class="sub" id="desc"></p><div class="stat" id="strength"></div><div class="stat" id="match"></div><button class="btn" onclick="share()">結果をシェアする</button><button class="btn ghost" onclick="start()">もう一度診断する</button></section><p class="small">※非公式のファン制作コンテンツです。選手の性格像はプレースタイルから着想した創作的な解釈であり、本人の実際の心理特性を断定するものではありません。</p></main><script>
const players=[
{name:'近本光司',type:'静かなる戦略家',desc:'周囲の状況を素早く読み、感情に流されず最適解を探す人。派手に主張せずとも、あなたの判断がチームを前進させます。',strength:'観察力・冷静さ・合理性',match:'大山悠輔'},
{name:'佐藤輝明',type:'自由な開拓者',desc:'他人の常識より、自分の可能性を信じる独創派。大胆なひらめきで、誰も思いつかなかった一打を放ちます。',strength:'独創性・大胆さ・自立心',match:'中野拓夢'},
{name:'森下翔太',type:'勝負を楽しむ挑戦者',desc:'大事な場面ほど気持ちが高まるチャレンジャー。前向きなエネルギーで周囲まで勢いづけます。',strength:'勝負強さ・行動力・情熱',match:'坂本誠志郎'},
{name:'大山悠輔',type:'信頼を積み重ねる支柱',desc:'目立つよりも誰かを支えることに喜びを感じる人。誠実さと継続力が、周囲に安心感をもたらします。',strength:'責任感・誠実さ・献身性',match:'近本光司'},
{name:'中野拓夢',type:'気配りのバランサー',desc:'小さな変化に気づき、自然とチームを整える調整役。柔軟さと細やかな気遣いがあなたの武器です。',strength:'協調性・柔軟性・気配り',match:'佐藤輝明'},
{name:'才木浩人',type:'まっすぐな努力家',desc:'高い目標を掲げ、地道な鍛錬を惜しまないタイプ。難しい課題にも真正面から向き合う強さがあります。',strength:'向上心・忍耐力・率直さ',match:'木浪聖也'},
{name:'村上頌樹',type:'精密な職人',desc:'感覚だけに頼らず、細部を積み重ねて完成度を高める人。丁寧な準備が大一番の安定感につながります。',strength:'分析力・集中力・計画性',match:'森下翔太'},
{name:'坂本誠志郎',type:'人を動かす司令塔',desc:'自分だけでなく仲間の強みまで見渡すリーダー。対話と先読みで、チームの力を最大限に引き出します。',strength:'統率力・洞察力・対話力',match:'森下翔太'},
{name:'木浪聖也',type:'粘り強い実務家',desc:'華やかな近道より、目の前の一歩を大切にする人。困難な局面でも投げ出さず、着実に結果へ近づきます。',strength:'粘り強さ・堅実さ・継続力',match:'才木浩人'},
{name:'石井大智',type:'静かな闘志の持ち主',desc:'穏やかな印象の奥に、揺るぎない芯を持つ人。任された場面で集中力を発揮し、信頼に応えます。',strength:'集中力・胆力・責任感',match:'中野拓夢'},
{name:'岩崎優',type:'動じない守護者',desc:'周囲が慌てるときこそ落ち着いていられる人。経験と自分のリズムを大切にし、最後まで役割を果たします。',strength:'安定感・忍耐・平常心',match:'佐藤輝明'},
{name:'藤川球児',type:'信念を貫く情熱家',desc:'理想を言葉にし、周囲を巻き込みながら前進する人。信念と熱意で、新たな流れを生み出します。',strength:'情熱・決断力・発信力',match:'近本光司'}
];
// Each answer contributes to three personality archetypes, reducing one-question determinism.
const questions=[
['新しいグループに入ったら？',['まず人間関係を観察する','気になる人に自分から話す','みんなが話しやすいよう配慮する','自分らしく自然体で過ごす'],[[0,6,10],[2,5,11],[3,4,7],[1,8,9]]],
['難しい課題を任されたら？',['情報を集めて作戦を立てる','とりあえず挑戦してみる','仲間と役割を分担する','一つずつ着実に片づける'],[[0,6,7],[1,2,11],[3,4,7],[5,8,9]]],
['褒められて一番うれしいのは？',['判断が的確だったね','発想が面白いね','あなたがいて助かった','最後までやり切ったね'],[[0,6,10],[1,2,11],[3,4,7],[5,8,9]]],
['予定外のトラブルが起きた！',['原因を冷静に分析する','新しい方法を試す','まず周りの人を安心させる','目の前のことに集中する'],[[0,6,10],[1,2,11],[3,4,7],[5,8,9]]],
['理想の休日は？',['静かに趣味を深める','初めての場所に出かける','親しい人とゆっくり過ごす','決めた目標に向けて練習する'],[[0,6,10],[1,2,11],[3,4,7],[5,8,9]]],
['意見が対立したら？',['根拠を整理して話す','自分の意見をはっきり伝える','全員が納得する着地点を探す','言い争わず行動で示す'],[[0,6,10],[1,2,11],[3,4,7],[5,8,9]]],
['チームで任されたい役割は？',['作戦を考える参謀','突破口を開くエース','みんなを支えるまとめ役','確実に仕事をこなす職人'],[[0,6,7],[1,2,11],[3,4,7],[5,8,9]]],
['失敗したときの反応は？',['原因を記録して改善する','すぐ次の挑戦に切り替える','周囲に相談して立て直す','悔しさを練習の力に変える'],[[0,6,10],[1,2,11],[3,4,7],[5,8,9]]],
['人からどう見られたい？',['知的で落ち着いている','個性的で刺激的','優しく信頼できる','努力を惜しまない'],[[0,6,10],[1,2,11],[3,4,7],[5,8,9]]],
['大切な勝負の直前は？',['準備した手順を確認する','ワクワクして気分が上がる','仲間に声をかける','自分のペースを守る'],[[0,6,7],[1,2,11],[3,4,7],[5,8,9]]],
['自分の強みを一つ選ぶなら？',['先を読む力','思い切りのよさ','人を理解する力','粘り強く続ける力'],[[0,6,10],[1,2,11],[3,4,7],[5,8,9]]],
['理想の成功とは？',['納得できる方法で達成する','誰も予想しない結果を出す','仲間と喜びを分かち合う','積み重ねが実を結ぶ'],[[0,6,10],[1,2,11],[3,4,7],[5,8,9]]]
];
let step=0,answers=[];function show(id){for(const el of ['start','quiz','result'])document.getElementById(el).classList.toggle('hidden',el!==id)}function start(){step=0;answers=[];render()}function render(){show('quiz');document.getElementById('counter').textContent=`QUESTION ${step+1} / ${questions.length}`;document.getElementById('fill').style.width=`${step/questions.length*100}%`;document.getElementById('question').textContent=questions[step][0];document.getElementById('choices').innerHTML='';questions[step][1].forEach((s,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(65+i)+'. '+s;b.onclick=()=>{answers[step]=i;step++;if(step===questions.length)finish();else render()};document.getElementById('choices').append(b)});document.getElementById('back').style.visibility=step?'visible':'hidden'}function prev(){if(step){step--;render()}}function finish(){let scores=players.map(()=>0);answers.forEach((a,i)=>{questions[i][2][a].forEach((idx,k)=>scores[idx]+=[3,2,1][k])});let max=Math.max(...scores),candidates=scores.map((v,i)=>v===max?i:-1).filter(i=>i>=0);let idx=candidates.reduce((a,b)=>((a*7+answers.reduce((s,v,i)=>s+(i+1)*(v+1),0))%2)?a:b);let p=players[idx];document.getElementById('player').textContent=p.name+' タイプ';document.getElementById('type').textContent=p.type;document.getElementById('desc').textContent=p.desc;document.getElementById('strength').textContent='✨ あなたの強み：'+p.strength;document.getElementById('match').textContent='🤝 相性のよいタイプ：'+p.match;window.lastResult=p;show('result');window.scrollTo(0,0)}async function share(){let p=window.lastResult;let t=`阪神タイガース性格診断の結果は「${p.name}タイプ」！ ${p.type} 🐯⚾`;if(navigator.share){try{await navigator.share({title:'あなたは阪神の誰タイプ？',text:t,url:location.href});return}catch(e){}}try{await navigator.clipboard.writeText(t+' '+location.href);alert('診断結果をコピーしました！')}catch(e){alert(t)}}
</script></body></html>
